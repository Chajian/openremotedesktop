name: CI

on:
  push:
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    env:
      ODR_DOMAIN: remote.example.test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan staged source and complete Git history
        run: node scripts/check-source-hygiene.mjs --all
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.3
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: AI project documentation and task check
        run: pnpm governance:check
      - name: Unit and integration tests
        run: pnpm test:run
      - name: Typecheck
        run: pnpm typecheck
      - name: End-to-end tests
        run: pnpm test:e2e
      - name: Validate Compose
        run: docker compose config
      - name: Build production image
        run: docker build -t open-desktop-remote:ci .
